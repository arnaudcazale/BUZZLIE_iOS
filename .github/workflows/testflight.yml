name: TestFlight

# Chaque push sur une branche release/* archive l'app et l'envoie à TestFlight.
on:
  push:
    branches: ["release/**"]
  workflow_dispatch:

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      KEY_DIR: ${{ github.workspace }}/../private_keys
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        run: xcodebuild -version

      - name: Clé API App Store Connect
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$KEY_DIR"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY_DIR/AuthKey_$ASC_KEY_ID.p8"
          chmod 600 "$KEY_DIR/AuthKey_$ASC_KEY_ID.p8"

      # Archive non signée : l'équipe n'a aucun appareil enregistré, donc pas de profil de
      # développement possible. La signature de distribution se fait à l'export.
      - name: Archive
        run: |
          xcodebuild archive \
            -project BuzzlieTest.xcodeproj \
            -scheme BuzzlieTest \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/BuzzlieTest.xcarchive" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGNING_ALLOWED=NO

      - name: Signature et envoi à TestFlight
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/BuzzlieTest.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist ci/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_DIR/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Nettoyage de la clé
        if: always()
        run: rm -rf "$KEY_DIR"
