name: TestFlight

# Chaque push sur une branche release/* archive l'app et l'envoie à TestFlight.
on:
  push:
    branches: ["release/**"]
  workflow_dispatch:

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      KEYCHAIN: ${{ runner.temp }}/signing.keychain-db
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        run: xcodebuild -version

      # Archive non signée : l'équipe n'a aucun appareil enregistré, donc pas de profil de
      # développement possible. La signature de distribution se fait à l'étape suivante.
      - name: Archive
        run: |
          xcodebuild archive \
            -project BuzzlieTest.xcodeproj \
            -scheme BuzzlieTest \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/BuzzlieTest.xcarchive" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGNING_ALLOWED=NO

      - name: Certificat de distribution
        env:
          DIST_P12_BASE64: ${{ secrets.DIST_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$DIST_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -P "$DIST_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/dist.p12"

      # Signature à la main avec codesign, pas avec `xcodebuild -exportArchive` : la signature
      # cloud de Xcode écrit le nom accentué du certificat (« Éloïse Chloé Loréna ») en forme
      # décomposée dans l'exigence de signature, et Apple rejette l'app (ITMS-90035).
      - name: Signature
        env:
          PROFILE_BASE64: ${{ secrets.APPSTORE_PROFILE_BASE64 }}
        run: |
          APP="$RUNNER_TEMP/ipa/Payload/BuzzlieTest.app"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/BuzzlieTest.xcarchive/Products/Applications/BuzzlieTest.app" "$APP"
          echo "$PROFILE_BASE64" | base64 --decode > "$APP/embedded.mobileprovision"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk 'NR==1 {print $2}')"
          codesign --force --sign "$IDENTITY" --keychain "$KEYCHAIN" \
            --entitlements ci/entitlements.plist --generate-entitlement-der "$APP"
          codesign --verify -vv --strict "$APP"
          cd "$RUNNER_TEMP/ipa" && zip -qry "$RUNNER_TEMP/BuzzlieTest.ipa" Payload

      - name: Envoi à TestFlight
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          xcrun altool --upload-app -f "$RUNNER_TEMP/BuzzlieTest.ipa" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Nettoyage
        if: always()
        run: |
          rm -rf ~/.appstoreconnect/private_keys
          security delete-keychain "$KEYCHAIN" || true
